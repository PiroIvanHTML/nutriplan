name: NutriPlan — Ristrutturazione (one-shot)

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'scripts/patch.py'
      - '.github/workflows/patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Applica patch
        run: |
          if [ -f scripts/patch.py ]; then
            python3 scripts/patch.py
          else
            echo "Nessuna patch da applicare (progetto già ristrutturato)."
          fi

      - name: Commit e push
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: ristruttura progetto in asset modulari"
          git push
